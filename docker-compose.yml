# Единый стек news-poster: БД + бэкенд + фронт-админка + n8n + rsshub + ollama.
# name: n8n-stack — чтобы тома n8n_data/ollama_data подхватились ТЕ ЖЕ, что уже есть
# (n8n-stack_n8n_data / n8n-stack_ollama_data) и данные n8n/модели не потерялись.
name: n8n-stack

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newsposter
      POSTGRES_PASSWORD: newsposter
      POSTGRES_DB: newsposter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsposter"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://newsposter:newsposter@db:5432/newsposter?schema=public
      PORT: "3000"
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: bge-m3
      OPENROUTER_URL: https://openrouter.ai/api/v1/chat/completions
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REWRITE_MODEL: ${REWRITE_MODEL:-openai/gpt-4o-mini}
      BOT_TOKEN: ${BOT_TOKEN}
      SERVICE_CHAT_ID: ${SERVICE_CHAT_ID}
      PREVIEW_TTL_DEFAULT: ${PREVIEW_TTL_DEFAULT:-1440}
      DEDUP_THRESHOLD: ${DEDUP_THRESHOLD:-0.85}
      DEDUP_WINDOW_HOURS: ${DEDUP_WINDOW_HOURS:-24}
      # Креды страницы логина админки (сессии выдаёт бэкенд, /auth/*). Значения — в корневом .env.
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Флаг Secure у сессионной куки; включать, когда админка за HTTPS.
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    # Порт наружу НЕ публикуем: API доступен с хоста только через админку (nginx /api, под логином),
    # а для n8n — по внутренней сети как http://backend:3000. Так админ-логин реально защищает API.
    # В node:22-slim нет curl/wget — проверяем /health через node fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s # миграции prisma при старте занимают время
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # host 8081 (:8080 занят astro-poster-web); контейнер слушает 80
      - "8081:80"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Europe/Moscow
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub
    ports:
      - "1200:1200"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  # n8n_data/ollama_data — external с явными именами: compose этими томами НЕ владеет,
  # поэтому `docker compose down -v` их не удалит. Подхватываются ТЕ ЖЕ существующие тома,
  # данные n8n и модели ollama сохраняются.
  n8n_data:
    external: true
    name: n8n-stack_n8n_data
  ollama_data:
    external: true
    name: n8n-stack_ollama_data
