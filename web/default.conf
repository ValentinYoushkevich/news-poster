# Конфиг nginx админки.
# SPA раздаётся свободно (бандл не секрет), а вот /api/* закрыт сессией:
# каждый запрос к API nginx сначала прогоняет через auth_request -> backend /auth/check
# (200 = кука сессии валидна, пропустить; 401 = отдать 401, фронт уведёт на /login).
# n8n это не касается: он ходит в backend:3000 напрямую по внутренней сети, мимо nginx.
server {
  listen 80;
  server_name _;

  # Лимит тела запроса — синхронно с лимитом Express (2mb), чтобы nginx не пропускал больше, чем примет бэкенд.
  client_max_body_size 2m;

  # Сжатие текстовых ответов (json от API, js/css/svg статики).
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1k;

  # Логин/логаут/me — без auth_request, иначе на страницу логина было бы не войти.
  location /api/auth/ {
    proxy_pass http://backend:3000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Остальной API — только с валидной сессией. Префикс /api срезается.
  location /api/ {
    auth_request /auth/check;
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Внутренний сабреквест для auth_request (снаружи недоступен).
  location = /auth/check {
    internal;
    proxy_pass http://backend:3000/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # Хешированная статика Vite (/assets/*.hash.js|css) — кэшируем навсегда:
  # при изменении контента меняется хеш в имени файла, устаревание не грозит.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA (history-режим vue-router).
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
